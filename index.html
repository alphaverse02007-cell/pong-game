<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pong Game</title>
<style>
  :root {
    --bg: #0f0f1a;
    --fg: #ffffff;
    --accent: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1 {
    font-size: 1.2rem;
    margin: 8px 0;
    letter-spacing: 2px;
  }
  #score {
    font-size: 1.5rem;
    margin-bottom: 6px;
  }
  canvas {
    background: #000;
    border: 2px solid var(--accent);
    border-radius: 8px;
    max-width: 95vw;
    max-height: 65vh;
    touch-action: none;
  }
  p.hint {
    opacity: 0.6;
    font-size: 0.85rem;
    margin-top: 8px;
    text-align: center;
  }
  button {
    margin-top: 10px;
    padding: 8px 18px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #000;
    font-weight: bold;
    font-size: 1rem;
  }
</style>
</head>
<body>
<h1>PONG</h1>
<div id="score">0 : 0</div>
<canvas id="game" width="600" height="400"></canvas>
<p class="hint">Mouse / touch move pannunga paddle ah control panna. AI vs Neenga.</p>
<button id="resetBtn">Restart</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const resetBtn = document.getElementById('resetBtn');

const W = canvas.width, H = canvas.height;
const paddleW = 10, paddleH = 80;

let player = { x: 10, y: H/2 - paddleH/2, score: 0 };
let ai = { x: W - 20, y: H/2 - paddleH/2, score: 0 };
let ball = { x: W/2, y: H/2, r: 8, vx: 5, vy: 3 };

function resetBall() {
  ball.x = W/2; ball.y = H/2;
  ball.vx = (Math.random() > 0.5 ? 1 : -1) * 5;
  ball.vy = (Math.random() * 6) - 3;
}

function updateScore() {
  scoreEl.textContent = player.score + " : " + ai.score;
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#333';
  ctx.setLineDash([6, 10]);
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#4ade80';
  ctx.fillRect(player.x, player.y, paddleW, paddleH);
  ctx.fillRect(ai.x, ai.y, paddleW, paddleH);

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
}

function update() {
  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.y - ball.r < 0 || ball.y + ball.r > H) {
    ball.vy *= -1;
  }

  if (
    ball.x - ball.r < player.x + paddleW &&
    ball.y > player.y &&
    ball.y < player.y + paddleH &&
    ball.vx < 0
  ) {
    ball.vx *= -1.05;
    ball.vy += (ball.y - (player.y + paddleH/2)) * 0.1;
  }

  if (
    ball.x + ball.r > ai.x &&
    ball.y > ai.y &&
    ball.y < ai.y + paddleH &&
    ball.vx > 0
  ) {
    ball.vx *= -1.05;
    ball.vy += (ball.y - (ai.y + paddleH/2)) * 0.1;
  }

  if (ball.x < 0) {
    ai.score++;
    updateScore();
    resetBall();
  } else if (ball.x > W) {
    player.score++;
    updateScore();
    resetBall();
  }

  const aiCenter = ai.y + paddleH/2;
  if (aiCenter < ball.y - 10) ai.y += 4;
  else if (aiCenter > ball.y + 10) ai.y -= 4;
  ai.y = Math.max(0, Math.min(H - paddleH, ai.y));
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function movePaddle(clientY) {
  const rect = canvas.getBoundingClientRect();
  const scale = H / rect.height;
  let y = (clientY - rect.top) * scale - paddleH/2;
  player.y = Math.max(0, Math.min(H - paddleH, y));
}

canvas.addEventListener('mousemove', e => movePaddle(e.clientY));
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  movePaddle(e.touches[0].clientY);
}, { passive: false });

resetBtn.addEventListener('click', () => {
  player.score = 0; ai.score = 0;
  updateScore();
  resetBall();
});

resetBall();
updateScore();
loop();
</script>
</body>
</html>
